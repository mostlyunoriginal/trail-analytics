<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trail Analytics — Flythrough</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.130.0/Build/Cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="cesium"></div>

  <div id="hud">
    <div id="trailName">…</div>
    <div class="stat"><span id="hudMile">0.00</span> mi</div>
    <div class="stat"><span id="hudElev">–</span> ft</div>
    <div class="stat"><span id="hudGrade">–</span>% grade</div>
  </div>

  <div id="panel">
    <div class="row">
      <button id="play" title="drive">▶</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" />
    </div>
    <div class="row small">
      <label>view
        <select id="mode">
          <option value="follow">follow</option>
          <option value="orbit">orbit</option>
          <option value="top">top-down</option>
        </select>
      </label>
      <label>heading <input id="heading" type="range" min="0" max="360" value="0" disabled /></label>
      <label>range <input id="range" type="range" min="60" max="1500" value="220" /></label>
      <label>exagg <input id="exagg" type="range" min="10" max="30" value="10" /> <span id="exaggVal">1.0×</span></label>
    </div>
    <div class="row small" id="layers">
      <label><input type="checkbox" id="lyrNaip" checked /> NAIP</label>
      <label><input type="checkbox" id="lyrTrail" checked /> trail</label>
      <label><input type="checkbox" id="lyrMvum" checked /> MVUM</label>
      <span id="legend">grade: <i style="background:#27b356"></i>&lt;8% <i style="background:#e0b62c"></i>&lt;14% <i style="background:#e07a2c"></i>&lt;20% <i style="background:#d63b3b"></i>≥20%</span>
    </div>
    <canvas id="profile" width="900" height="110"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.130.0/Build/Cesium/Cesium.js"></script>
  <script src="app.js"></script>
</body>
</html>
